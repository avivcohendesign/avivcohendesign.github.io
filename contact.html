<style>
  :root{
    --bg:#F3F3F3;
    --ink:#4158a7;
    --ink-soft:#5567b0;
    --ink-faint:#8b9bd0;
    --line:rgba(40,40,45,.12);
    --brown:#3c2415;
    --serif:'Playfair Display', serif;
    --display:'Hanken Grotesk', sans-serif;
    --body:'Familjen Grotesk', sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
    --maxw:1380px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);background:var(--bg);color:var(--ink);
    min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
    transition:background .4s var(--ease), color .4s var(--ease);
  }
  body[data-home-theme="dark"]{
    --bg:#3b2313;
    --ink:#a3ddf1;
    --ink-soft:#a3ddf1;
    --ink-faint:#7fb8cf;
    --line:rgba(163,221,241,.2);
  }

  nav{position:fixed;top:2.2rem;right:4.6rem;left:auto;z-index:30;
    display:block;font-family:var(--serif);font-size:1.15rem;letter-spacing:0;}
  nav .links{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem}
  nav a{color:var(--ink);text-decoration:none;position:relative;cursor:pointer;
    transition:opacity .25s;font-style:italic}
  nav a.active{font-style:normal;font-weight:600}
  nav a:not(.active):hover{opacity:.6}

  main{position:relative;z-index:10}
  .section{position:relative;min-height:100vh}
  .sec-inner{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:6rem 3.5vw}

  .contact-kicker{font-family:var(--serif);font-style:italic;font-size:1.05rem;
    color:var(--ink-faint);margin-bottom:.8rem;display:block}
  .contact-title{font-family:var(--serif);font-weight:400;color:var(--ink);
    font-size:clamp(3.4rem,8vw,7rem);line-height:1.05;letter-spacing:0;margin-bottom:1.6rem}
  .contact-sub{color:var(--ink-soft);font-size:1.08rem;line-height:1.6;max-width:44ch;margin-bottom:3rem}

  .contact-icons{display:flex;align-items:center;gap:1.4rem}
  .contact-icons a{display:flex;align-items:center;justify-content:center;
    width:60px;height:60px;border-radius:50%;border:1px solid var(--line);
    color:var(--ink);transition:.3s var(--ease);background:rgba(44,44,48,.03)}
  .contact-icons a:hover{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-3px)}
  .contact-icons svg{width:23px;height:23px}

  .contact-email{margin-top:2.4rem;font-family:var(--serif);font-style:italic;
    font-size:1.15rem;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:.2rem;transition:opacity .2s}
  .contact-email:hover{opacity:.6}

  @media(max-width:880px){
    .sec-inner{padding:6.5rem 1.4rem 4rem}
    nav{top:1.2rem;right:1.4rem;font-size:.9rem}
    nav .links{gap:.2rem}
  }
</style>
</head>
