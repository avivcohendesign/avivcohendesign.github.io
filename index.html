<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviv Cohen — Graphic Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Familjen+Grotesk:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,500&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Coffee Tea Demo';
    src:url('coffee-tea-demo.woff') format('woff');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --bg:#F3F3F3;
    --ink:#2c2c30;
    --ink-soft:#5a5a60;
    --ink-faint:#9a9a9f;
    --line:rgba(40,40,45,.12);
    --blob-a:#4b54e8;   /* blue  */
    --blob-b:#ff4d4d;   /* red   */
    --blob-c:#8a7bff;   /* violet*/
    --brown:#3c2415;    /* elegant hero ink */
    --serif:'Playfair Display', serif;
    --display:'Hanken Grotesk', sans-serif;
    --body:'Familjen Grotesk', sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
    --maxw:1380px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);background:var(--bg);color:var(--ink);
    min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }

  .sec-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  #project .sec-bg{position:fixed;overflow:hidden}

  /* ---------- CHROME (fixed nav + corner labels) ---------- */
  .chrome{transition:opacity .4s var(--ease)}
  body.project-open .chrome{opacity:0;pointer-events:none}

  nav{position:fixed;top:2.2rem;right:4.6rem;left:auto;z-index:30;
    display:flex;align-items:flex-start;gap:.9rem;font-family:var(--serif);font-size:1.15rem;letter-spacing:0;}
  nav .links{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem}
  nav a{color:var(--ink);text-decoration:none;position:relative;cursor:pointer;
    transition:opacity .25s;font-style:italic}
  nav a.active{font-style:normal;font-weight:600}
  nav a:not(.active):hover{opacity:.6}
  #themeToggle{background:none;border:none;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:.3rem;opacity:.85;transition:opacity .2s}
  #themeToggle:hover{opacity:1}
  #themeToggle svg{width:19px;height:19px}
  #themeToggle .icon-moon{display:none}
  body[data-home-theme="dark"] #themeToggle .icon-sun{display:none}
  body[data-home-theme="dark"] #themeToggle .icon-moon{display:block}
  body[data-home-theme="dark"][data-section="home"] nav a,
  body[data-home-theme="dark"][data-section="works"] nav a,
  body[data-home-theme="dark"][data-section="home"] #themeToggle,
  body[data-home-theme="dark"][data-section="works"] #themeToggle{color:#f1efed}


  body[data-theme="dark"]{
    --bg:#19191c;
    --ink:#f1efed;
    --ink-soft:#b6b6bc;
    --ink-faint:#7c7c82;
    --line:rgba(255,255,255,.14);
  }
  body[data-theme="dark"] .card{background:#2a2a2e}
  body[data-theme="dark"] .chrome{transition:opacity .4s var(--ease), color .4s var(--ease)}

  body[data-home-theme="dark"] #home,
  body[data-home-theme="dark"] #works{
    --bg:#19191c;
    --ink:#f1efed;
    --ink-soft:#b6b6bc;
    --ink-faint:#7c7c82;
    --line:rgba(255,255,255,.14);
  }


  /* ---------- SECTIONS (one continuous scroll) ---------- */
  main{position:relative;z-index:10;overflow:clip}
  .section{position:relative}
  .sec-inner{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto}

  /* HOME */
  #home{min-height:100vh;padding:4rem 3.5vw 3rem;display:flex;flex-direction:column;justify-content:space-between;
    background:var(--bg)}
  .hero-elegant{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;flex:1}
  .hero-top{position:relative}
  .hero-serif-title{font-family:var(--serif);font-weight:400;color:var(--ink);
    font-size:clamp(3.6rem,9.2vw,8.2rem);line-height:1.18;letter-spacing:.01em;margin-left:2.5rem}
  .hero-icons{position:absolute;top:4.2rem;left:clamp(340px,36vw,620px);
    display:flex;gap:.6rem;padding:.7rem .9rem}
  .hero-icons a{color:var(--ink);display:flex;opacity:.85;transition:opacity .2s}
  .hero-icons a:hover{opacity:1}
  .hero-icons svg{width:20px;height:20px}
  .hero-bottom{position:relative;display:flex;align-items:flex-end;justify-content:flex-end;gap:0;margin-top:8rem;width:100%}
  .hero-portrait{width:min(460px,46vw);height:auto;object-fit:contain;
    flex:none;margin-bottom:2.2rem;position:relative;z-index:1}
  .hero-tagline{margin-left:-1.5rem;padding-bottom:2.4rem;position:relative;z-index:2}
  .tagline-script{display:block;font-family:var(--serif);font-style:italic;font-weight:500;
    color:var(--ink);font-size:clamp(2rem,4.4vw,3.8rem);letter-spacing:-.01em;margin-bottom:-1rem;margin-left:2rem;
    transition:opacity .5s var(--ease), transform .5s var(--ease)}
  .tagline-script.fade{opacity:0;transform:translateY(10px)}
  .tagline-serif{display:block;font-family:var(--serif);font-weight:700;color:var(--ink);
    font-size:clamp(4rem,10.5vw,9.5rem);letter-spacing:-.02em;line-height:.9}
  @media(max-width:880px){
    #home{padding:6.5rem 1.4rem 3rem}
    .hero-icons{position:static;margin-top:1rem;width:fit-content}
    .hero-bottom{flex-direction:column;align-items:flex-start;gap:1rem}
    .hero-portrait{width:70vw;height:80vw}
    .hero-tagline{margin-left:0}
    .tagline-script{margin-left:.5rem}
  }

  /* WORKS */
  #works{margin-top:-15rem}
  #works{background:var(--bg)}
  #works .sec-inner{padding:9.8rem 1.5vw 7rem;min-height:100vh;max-width:var(--maxw);width:auto;margin:0 auto}
  .work-list{width:calc(100% + 4vw);margin-left:-2vw;border-top:1px solid var(--ink)}
  .work-row{position:relative;display:flex;align-items:baseline;gap:2.2rem;color:var(--ink);
    padding:.65rem 2vw;border-bottom:1px solid var(--ink);cursor:pointer;}
  .work-cat{font-family:var(--serif);font-style:italic;font-size:1.02rem;
    color:var(--ink-faint);width:170px;flex:none;text-transform:lowercase;
    align-self:flex-start;margin-top:-.3rem}
  .work-title{font-family:var(--serif);font-weight:400;
    font-size:clamp(1.7rem,3.8vw,3.1rem);letter-spacing:-.01em;transition:opacity .2s var(--ease)}
  .work-row:hover .work-title{font-style:italic}
  .work-preview{position:fixed;z-index:40;right:2rem;bottom:2rem;
    max-width:min(46vw,640px);max-height:min(46vw,620px);width:auto;height:auto;
    pointer-events:none;display:block;object-fit:contain;opacity:0;
    transform:translateY(16px);transition:opacity .35s var(--ease), transform .35s var(--ease);
    box-shadow:0 -10px 50px rgba(20,20,25,.18)}
  .work-preview.show{opacity:1;transform:translateY(0)}
  @media(max-width:880px){
    .work-preview{display:none}
    .work-cat{width:110px;font-size:.72rem}
    .work-row{gap:1rem}
  }

  /* ---------- PROJECT OVERLAY ---------- */
  .project-overlay{position:fixed;inset:0;z-index:50;background:var(--bg);
    overflow:hidden;display:none}
  .project-overlay.open{display:block;animation:viewIn .5s var(--ease) both}
  .project-overlay.closing{display:block;animation:viewOut .35s var(--ease) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes viewOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(14px)}}
  #project .sec-inner{padding:5rem 2rem 0;height:100vh;display:flex;flex-direction:column}
  .back{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink-soft);cursor:pointer;
    font-size:.98rem;margin-bottom:2rem;transition:.25s;flex:none}
  .back:hover{color:var(--ink);gap:.8rem}
  .proj-head{margin-bottom:1.6rem}
  .proj-head .cat{color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;
    font-size:.82rem;margin-top:.6rem}
  .proj-head h1{font-family:var(--serif);font-weight:500;
    font-size:clamp(1.3rem,2.2vw,1.9rem);line-height:.98;letter-spacing:-.025em}

  /* two-column layout: left text is static, only the right image column scrolls */
  .proj-layout{display:grid;grid-template-columns:minmax(220px,0.8fr) 1.8fr;gap:3rem;
    flex:1;min-height:0}
  .proj-left{display:flex;flex-direction:column;gap:1.6rem;height:100%;
    overflow-y:auto;padding-bottom:2rem;border-right:1px solid var(--ink);padding-right:2.4rem}
  .proj-desc p{font-size:.82rem;line-height:1.5;color:var(--ink);margin-bottom:.9rem;max-width:34ch}
  .proj-desc p.lead{font-family:var(--display);font-size:.95rem;font-weight:400}
  .proj-right{display:flex;flex-direction:column;gap:1.3rem;height:100%;
    overflow-y:auto;padding-bottom:6rem;scrollbar-width:thin;scrollbar-color:var(--ink-faint) transparent}
  .proj-right::-webkit-scrollbar{width:6px}
  .proj-right::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:3px}
  .proj-img{width:100%;border-radius:0;position:relative;overflow:hidden;flex:none}
  .proj-img.grad{min-height:280px;background-size:cover;background-position:center}
  .proj-img img,.proj-img video{display:block;width:100%;height:auto;
    object-fit:contain;border-radius:0}
  .proj-img .compact-video-wrap{display:block;width:fit-content;max-width:100%;
    margin:0 auto;border-radius:0;overflow:hidden}
  .proj-img .compact-video-wrap video{display:block;width:auto;max-height:72vh;
    height:auto;max-width:100%;border-radius:0}
  .proj-row.row-mode{display:flex;gap:1rem}
  .proj-row.row-mode .proj-img{flex:none;width:calc(33.333% - .67rem);min-width:0}
  @media(max-width:880px){
    .proj-row.row-mode{flex-direction:column}
    .proj-row.row-mode .proj-img{width:100%}
  }

  /* cute horizontal-scroll strip of illustrations */
  .proj-strip{display:flex;gap:1.1rem;overflow-x:auto;padding:.6rem .2rem 1.6rem;
    flex:none;scroll-snap-type:x proximity;scrollbar-width:thin;
    scrollbar-color:var(--ink-faint) transparent}
  .proj-strip::-webkit-scrollbar{height:6px}
  .proj-strip::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:3px}
  .proj-strip img{flex:none;width:150px;height:150px;object-fit:contain;
    border-radius:18px;padding:.9rem;scroll-snap-align:start;
    transition:transform .3s var(--ease)}
  .proj-strip img:hover{transform:translateY(-4px) rotate(-2deg)}
  .next{border-top:1px solid var(--ink);padding-top:1.6rem;cursor:pointer;
    display:flex;flex-direction:column;gap:.3rem;transition:.3s;margin-top:auto;flex:none}
  .next:hover{padding-left:.6rem}
  .next .lbl{color:var(--ink-faint);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
  .next .nm{font-family:var(--serif);font-weight:500;font-size:clamp(1rem,1.8vw,1.4rem);letter-spacing:-.02em}


  @media(max-width:880px){
    nav{top:1.2rem;right:1.4rem;font-size:.9rem}
    nav .links{gap:.2rem}
    .grid{grid-template-columns:1fr}
    .card.wide,.card.sq{grid-column:1/-1;aspect-ratio:4/3}
    #project .sec-inner{height:auto;overflow-y:auto}
    .project-overlay{overflow-y:auto}
    .proj-layout{grid-template-columns:1fr;gap:1.8rem;height:auto}
    .proj-left,.proj-right{height:auto;overflow-y:visible}
    .proj-left{border-right:none;padding-right:0;border-bottom:1px solid var(--ink);padding-bottom:1.6rem}
    #works .sec-inner,#project .sec-inner{padding-left:1.4rem;padding-right:1.4rem}
  }
</style>
</head>
<body data-section="home">

  <!-- fixed chrome -->
  <div class="chrome">
    <nav>
      <div class="links">
        <a data-go="home" class="active">Home</a>
        <a href="about.html">About</a>
        <a data-go="works">Works</a>
      </div>
      <button id="themeToggle" aria-label="Toggle dark mode" type="button">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8l1.8-1.8M18 6l1.8-1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.4A8.5 8.5 0 1 1 9.6 3.5a7 7 0 0 0 10.9 10.9z"/></svg>
      </button>
    </nav>
  </div>

  <main>
    <!-- HOME -->
    <section class="section" id="home">
      <div class="sec-bg"></div>
      <div class="hero-elegant">
        <div class="hero-top">
          <h1 class="hero-serif-title">Hi! I&rsquo;m<br>Aviv Cohen :)</h1>
          <div class="hero-icons">
            <a href="about.html" aria-label="CV / Resume">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
            </a>
            <a href="https://instagram.com/aviv_arts" target="_blank" rel="noopener" aria-label="Instagram">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
            </a>
            <a href="https://wa.me/972549482244" target="_blank" rel="noopener" aria-label="WhatsApp">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.9c0 4.7-3.8 8.5-8.5 8.5-1.5 0-2.9-.4-4.1-1.1L3.5 20.5l1.2-4.3a8.4 8.4 0 0 1-1.2-4.3c0-4.7 3.8-8.5 8.5-8.5s8.5 3.8 8.5 8.5z"/><path d="M8.5 8.8c.1-.5.6-.9 1.1-.9.2 0 .5 0 .7.1.2 0 .4.1.5.4l.7 1.7c.1.2 0 .5-.1.7l-.5.6c-.1.2-.1.4 0 .6.4.8 1.5 1.9 2.3 2.3.2.1.4.1.6 0l.6-.5c.2-.1.5-.2.7-.1l1.7.7c.2.1.4.3.4.5 0 .2.1.5.1.7 0 .5-.4 1-.9 1.1-.4.1-.9.2-1.5 0-1.3-.3-2.7-1.2-3.8-2.3-1.1-1.1-2-2.5-2.3-3.8-.2-.6-.1-1.1 0-1.5z"/></svg>
            </a>
          </div>
        </div>
        <div class="hero-bottom">
          <img class="hero-portrait" id="heroPortrait" src="hero-portrait-light.png" data-light="hero-portrait-light.png" data-dark="hero-portrait-dark.png" alt="Aviv Cohen">
          <div class="hero-tagline">
            <span class="tagline-script" id="taglineLoop">Graphic</span>
            <span class="tagline-serif">designer</span>
          </div>
        </div>
      </div>
    </section>

    <!-- WORKS -->
    <section class="section" id="works">
      <div class="sec-bg"></div>
      <div class="sec-inner">
        <div class="work-list" id="grid"></div>
      </div>
    </section>
    <img class="work-preview" id="workPreview" alt="">
  </main>

  <!-- PROJECT OVERLAY -->
  <div class="project-overlay" id="project">
    <div class="sec-bg"></div>
    <div class="sec-inner">
      <span class="back" id="back">&larr; Back to works</span>
      <div class="proj-layout">
        <div class="proj-left">
          <div class="proj-head"><h1 id="pTitle"></h1><div class="cat" id="pCat"></div></div>
          <div class="proj-desc" id="pDesc"></div>
          <div class="next" id="next"><span class="lbl">Next project</span><span class="nm" id="pNext"></span></div>
        </div>
        <div class="proj-right">
          <div class="proj-img" id="pHero"></div>
          <div class="proj-row" id="pRow">
            <div class="proj-img" id="pg1"></div>
            <div class="proj-img" id="pg2"></div>
            <div class="proj-img" id="pg3"></div>
          </div>
          <div class="proj-row" id="pRow2">
            <div class="proj-img" id="pg4"></div>
            <div class="proj-img" id="pg5"></div>
            <div class="proj-img" id="pg6"></div>
          </div>
          <div class="proj-strip" id="pStrip"></div>
        </div>
      </div>
    </div>
  </div>

<script>
function thumb(p){
  if(p.img) return `url('${p.img}') center/cover no-repeat`;
  return `linear-gradient(${p.ang||135}deg, ${p.c1}, ${p.c2})`;
}
const body = document.body;
document.querySelectorAll('nav a[data-go]').forEach(a=>{
  a.addEventListener('click',()=>{
    const el = document.getElementById(a.dataset.go);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
});
const obs = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const id = e.target.id;
      body.dataset.section = id;
      document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
      const link = document.querySelector(`nav a[data-go="${id}"]`);
      if(link) link.classList.add('active');
    }
  });
},{rootMargin:'-45% 0px -45% 0px', threshold:0});
['home','works'].forEach(id=>obs.observe(document.getElementById(id)));

function setProjImg(el, src, gradient, alt, compact){
  if(src){
    el.classList.remove('grad');
    el.style.background = 'none';
    const compactStyle = compact ? ' style="max-height:72vh;width:auto;margin:0 auto"' : '';
    if(/\.(mp4|mov|webm)$/i.test(src)){
      if(compact){
        el.innerHTML = `<div class="compact-video-wrap"><video src="${src}" autoplay muted loop playsinline></video></div>`;
      } else {
        el.innerHTML = `<video src="${src}" autoplay muted loop playsinline></video>`;
      }
    } else {
      el.innerHTML = `<img src="${src}" alt="${alt}"${compactStyle}>`;
    }
  } else {
    el.classList.add('grad');
    el.innerHTML = '';
    el.style.background = gradient;
  }
}

const overlay = document.getElementById('project');
let activeList = null;
function openProject(id, list){
  list = list || activeList;
  activeList = list;
  const p = list[id];
  const nextId = (id+1)%list.length;
  const next = list[nextId];
  document.getElementById('pCat').textContent = p.cat;
  document.getElementById('pTitle').textContent = p.title;
  document.getElementById('pDesc').innerHTML = `<p class="lead">${p.lead}</p>` + p.body.map(t=>`<p>${t}</p>`).join('')
    + `<p><strong>${p.client}</strong> &middot; ${p.role} &middot; ${p.year} &middot; ${p.tools}</p>`;
  const heroEl = document.getElementById('pHero');
  if(p.heroVideo){
    heroEl.classList.remove('grad');
    heroEl.style.background = 'none';
    const heroVideoStyle = p.heroVideoCompact ? ' style="max-height:72vh;width:auto;margin:0 auto"' : '';
    heroEl.innerHTML = `<video src="${p.heroVideo}" poster="${p.img||''}" autoplay muted loop playsinline${heroVideoStyle}></video>`;
  } else if(p.video){
    heroEl.classList.remove('grad');
    heroEl.style.background = 'none';
    heroEl.innerHTML = `<video src="${p.video}" poster="${p.img||''}" autoplay muted loop playsinline></video>`;
  } else if(p.heroImg){
    heroEl.classList.remove('grad');
    heroEl.style.background = 'none';
    const heroImgStyle = p.heroImgWidth ? ` style="width:${p.heroImgWidth};margin:0 auto"` : '';
    heroEl.innerHTML = `<img src="${p.heroImg}" alt="${p.title}"${heroImgStyle}>`;
  } else {
    setProjImg(heroEl, p.img, thumb(p), p.title);
  }
  setProjImg(document.getElementById('pg1'), p.img1, `linear-gradient(${(p.ang+40)}deg, ${p.c2}, ${p.c1})`, p.title, p.img1Compact);
  setProjImg(document.getElementById('pg2'), p.img2, `linear-gradient(${p.ang}deg, ${p.c1}, ${p.c2})`, p.title, p.img2Compact);
  setProjImg(document.getElementById('pg3'), p.img3, `radial-gradient(circle at 40% 30%, ${p.c2}, ${p.c1})`, p.title, p.img3Compact);
  const pRow2El = document.getElementById('pRow2');
  const pg6El = document.getElementById('pg6');
  if(p.img4 || p.img5 || p.img6){
    pRow2El.style.display = 'flex';
    setProjImg(document.getElementById('pg4'), p.img4, `linear-gradient(${(p.ang+40)}deg, ${p.c2}, ${p.c1})`, p.title, p.img4Compact);
    setProjImg(document.getElementById('pg5'), p.img5, `linear-gradient(${p.ang}deg, ${p.c1}, ${p.c2})`, p.title, p.img5Compact);
    if(p.img6){
      pg6El.style.display = '';
      setProjImg(pg6El, p.img6, `radial-gradient(circle at 40% 30%, ${p.c2}, ${p.c1})`, p.title, p.img6Compact);
    } else {
      pg6El.style.display = 'none';
    }
    pRow2El.classList.add('row-mode');
  } else {
    pRow2El.style.display = 'none';
  }
  document.getElementById('pRow').classList.toggle('row-mode', !!p.imgRow);
  const stripEl = document.getElementById('pStrip');
  stripEl.style.display = p.strip ? 'flex' : 'none';
  stripEl.innerHTML = p.strip ? p.strip.map(src=>`<img src="${src}" alt="${p.title}">`).join('') : '';
  document.getElementById('pNext').textContent = next.title;
  document.getElementById('next').onclick = ()=>{openProject(nextId, list);};
  overlay.classList.add('open');
  overlay.querySelector('.proj-right')?.scrollTo({top:0});
  overlay.querySelector('.proj-left')?.scrollTo({top:0});
  body.classList.add('project-open');
  body.style.overflow='hidden';
  if(p.title === 'Prism' || p.title === 'Maskit.code'){
    body.dataset.theme = 'dark';
  } else {
    delete body.dataset.theme;
  }
}
document.getElementById('back').addEventListener('click',()=>{
  overlay.classList.remove('open');
  overlay.classList.add('closing');
  overlay.addEventListener('animationend', ()=>overlay.classList.remove('closing'), {once:true});
  delete body.dataset.theme;
  body.classList.remove('project-open');
  body.style.overflow='';
});

/* ---------- HOME THEME TOGGLE (affects only the home page) ---------- */
let homeTheme = localStorage.getItem('homeTheme');
const heroPortraitImg = document.getElementById('heroPortrait');
function applyHeroPortrait(){
  if(!heroPortraitImg) return;
  heroPortraitImg.src = homeTheme === 'dark' ? heroPortraitImg.dataset.dark : heroPortraitImg.dataset.light;
}
if(homeTheme === 'dark'){ document.body.dataset.homeTheme = 'dark'; }
applyHeroPortrait();
const themeToggleBtn = document.getElementById('themeToggle');
if(themeToggleBtn){
  themeToggleBtn.addEventListener('click', ()=>{
    if(document.body.dataset.homeTheme === 'dark'){
      delete document.body.dataset.homeTheme;
      homeTheme = 'light';
    } else {
      document.body.dataset.homeTheme = 'dark';
      homeTheme = 'dark';
    }
    localStorage.setItem('homeTheme', homeTheme);
    applyHeroPortrait();
  });
}

const grid = document.getElementById('grid');
const workPreview = document.getElementById('workPreview');
ALLWORKS.forEach((p,i)=>{

      workPreview.src = p.img;
